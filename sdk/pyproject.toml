[project]
name = "clawguard"
version = "0.1.0"
description = "Python SDK for ClawGuard — AI Agent Firewall"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
license = "MIT"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.12",
    "mypy>=1.15",
    "pip-audit>=2.7",
    "build>=1.2",
    "setuptools>=77.0",
    "wheel>=0.45",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clawguard*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["clawguard"]
check_untyped_defs = true
warn_unused_ignores = true
