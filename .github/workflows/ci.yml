name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.project }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, sdk]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Audit dependencies
        run: uv run --no-sync pip-audit --local --skip-editable
      - name: Build SDK distributions from the locked environment
        if: matrix.project == 'sdk'
        run: uv run --no-sync python -m build --no-isolation

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked environment
        run: npm ci
      - name: Test API client
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    env:
      CLAWGUARD_ADMIN_KEY: ci-only-admin-key-not-for-deployment
      CLAWGUARD_AGENT_KEYS: '{"research-agent":"ci-only-agent-key-not-for-deployment"}'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build runtime images
        run: docker compose build backend frontend
