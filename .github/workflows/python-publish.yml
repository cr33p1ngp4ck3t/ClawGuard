name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - name: Install locked build environment
        run: uv sync --locked
      - name: Verify SDK
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync pip-audit --local --skip-editable
      - name: Build release distributions
        run: uv run --no-sync python -m build --no-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: sdk/dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/clawguard/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
