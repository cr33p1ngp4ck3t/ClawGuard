services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLAWGUARD_ADMIN_KEY: ${CLAWGUARD_ADMIN_KEY:?Set a distinct admin key in .env}
      CLAWGUARD_AGENT_KEYS: ${CLAWGUARD_AGENT_KEYS:?Set agent keys JSON in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DB_PATH: /app/data/clawguard.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-3}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - backend-data:/app/data
      - ./backend/policies:/app/policies:ro
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --limit-concurrency 32 --ws-max-size 8192
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/ws}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  backend-data:
