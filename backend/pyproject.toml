[project]
name = "clawguard-gateway"
version = "0.1.0"
description = "AI Agent Firewall - Secure agent-to-tool pipelines"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.9",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "groq>=0.9.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "cryptography>=44.0",
    "ruff>=0.12",
    "mypy>=1.15",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "config.py", "auth.py", "limits.py", "api", "audit", "detection", "policy", "proxy", "demo"]
check_untyped_defs = true
warn_unused_ignores = true
