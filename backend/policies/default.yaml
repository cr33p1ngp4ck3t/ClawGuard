name: ClawGuard Research Policy
version: "2.0"
agent_rules:
  research-agent:
    - tool_name: web_fetch
      allowed: true
    - tool_name: web_search
      allowed: true
allowed_origins:
  research-agent:
    - https://example.com
    - https://en.wikipedia.org
allowed_methods:
  research-agent: [GET, HEAD]
max_response_size_kb: 512
